<section class="py-8 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
    <div class="flex items-center justify-between gap-2.5 mb-6">
        <div class="flex items-center gap-2.5">
            <span class="w-1.5 h-6 bg-emerald-600 rounded-full inline-block"></span>
            <h2 class="text-2xl font-bold tracking-tight text-gray-900">
                All <span class="text-emerald-600">Categories</span>
            </h2>
        </div>
        <a routerLink="/categories" class="text-sm font-semibold text-emerald-600 hover:underline">
            View All <i class="fa-solid fa-arrow-right text-xs"></i>
        </a>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-1.5">
        @for(category of categories() ; track category._id){
        <div [routerLink]="['/c-details' , category._id]"
            class="cursor-pointer bg-white border-2 border-gray-100 shadow-md hover:shadow-emerald-200 transition-all duration-150 rounded-md dark:bg-emerald-600 dark:text-white p-1 flex flex-col justify-between items-center">
            <div class="w-20 h-20 my-1">
                <img class="w-full h-full object-cover rounded-full" [src]="category.image" [alt]="category.name"
                    [title]="category.slug">
            </div>
            <div class="my-1">
                <h2 class="text-lg font-bold"> {{category.name}} </h2>
            </div>
        </div>
        }
    </div>
</section>
